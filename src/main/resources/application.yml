spring:
  application:
    name: docker-watchdog
  mail:
    host: ${SMTP_HOST}
    port: ${SMTP_PORT:587}
    username: ${SMTP_USERNAME:}
    password: ${SMTP_PASSWORD:}
    properties:
      mail.smtp.auth: ${SMTP_AUTH:true}
      mail.smtp.starttls.enable: ${SMTP_STARTTLS:true}
      mail.smtp.ssl.enable: ${SMTP_SSL_ENABLE:false}
      mail.smtp.connectiontimeout: ${SMTP_CONNECTION_TIMEOUT_MS:10000}
      mail.smtp.timeout: ${SMTP_TIMEOUT_MS:10000}
      mail.smtp.writetimeout: ${SMTP_WRITE_TIMEOUT_MS:10000}
      mail.smtp.socks.host: ${SMTP_SOCKS_HOST:}
      mail.smtp.socks.port: ${SMTP_SOCKS_PORT:1080}

watchdog:
  containers: ${CONTAINERS:all}
  check-interval-ms: ${CHECK_INTERVAL_MS:60000}
  report-cron: "${WEEKLY_REPORT_CRON:0 0 8 * * MON}"
  report-timezone: ${REPORT_TIMEZONE:UTC}
  docker-command: ${DOCKER_COMMAND:docker}
  recipients: ${SMTP_TO}
  from: ${SMTP_FROM}
  subject-prefix: ${SUBJECT_PREFIX:[Docker Watchdog]}
