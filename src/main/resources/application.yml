spring:
  application:
    name: docker-watchdog
  mail:
    host: ${SMTP_HOST}
    port: ${SMTP_PORT:587}
    username: ${SMTP_USERNAME:}
    password: ${SMTP_PASSWORD:}
    properties:
      mail.smtp.auth: ${SMTP_AUTH:true}
      mail.smtp.starttls.enable: ${SMTP_STARTTLS:true}

watchdog:
  containers: ${CONTAINERS:all}
  check-interval-ms: ${CHECK_INTERVAL_MS:60000}
  report-cron: "${WEEKLY_REPORT_CRON:0 0 8 * * MON}"
  report-timezone: ${REPORT_TIMEZONE:UTC}
  docker-command: ${DOCKER_COMMAND:docker}
  recipients: ${SMTP_TO}
  subject-prefix: ${SUBJECT_PREFIX:[Docker Watchdog]}
